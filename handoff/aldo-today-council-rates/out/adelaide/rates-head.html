 2026/27?", "acceptedAnswer": {"@type": "Answer", "text": "11.967651 cents per dollar of annual value for residential land (was 11.5205 in 2025/26), so a home with an annual value of $20,000 pays $2,394. Non-residential land pays 14.660372 cents and vacant land 23.935301 cents."}}, {"@type": "Question", "name": "What is the minimum rate in the City of Adelaide?", "acceptedAnswer": {"@type": "Answer", "text": "$415 for 2026/27 (was $400), paid by any property with an annual value under about $3,468."}}, {"@type": "Question", "name": "Is there a cap on City of Adelaide rate rises?", "acceptedAnswer": {"@type": "Answer", "text": "Increases in general rates are capped at 10% a year, applied automatically (not where the rise comes from improvements, or a change of land use, ownership or occupancy). Pensioners get a $100 rebate."}}, {"@type": "Question", "name": "When are City of Adelaide rates due?", "acceptedAnswer": {"@type": "Answer", "text": "In four instalments: 1 September 2026, 1 December 2026, 1 March 2027 and 1 June 2027."}}, {"@type": "Question", "name": "Does my rates notice include the Emergency Services Levy?", "acceptedAnswer": {"@type": "Answer", "text": "No. The ESL is billed separately by RevenueSA. The Green Adelaide levy is on your council notice, but council only collects it for the state."}}, {"@type": "Question", "name": "What if I think my annual value is too high?", "acceptedAnswer": {"@type": "Answer", "text": "Object to the Valuer-General in writing within 60 days of receiving your first rates notice for the year — there is no fee. Keep paying while it is reviewed."}}]}]}</script>
